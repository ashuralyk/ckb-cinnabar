[package]
name = "ckb-cinnabar-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for scaffolding, building, simulating, and explaining Cinnabar CKB contracts"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ashuralyk/ckb-cinnabar"
homepage = "https://github.com/ashuralyk/ckb-cinnabar"
documentation = "https://docs.rs/ckb-cinnabar-mcp"
readme = "README.md"
keywords = ["ckb", "nervos", "smart-contract", "mcp", "blockchain"]
categories = ["cryptography::cryptocurrencies", "development-tools", "command-line-utilities"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ckb-cinnabar-calculator = { version = "0.1.0", path = "../calculate" }
serde_json = "1.0"
tokio = { version = "1.43.0", features = ["rt", "macros"] }

[[bin]]
name = "ckb-cinnabar-mcp"
path = "src/main.rs"
