[template]
cargo_generate_version = ">=0.19.0"

[placeholders.use_local_cinnabar]
type = "bool"
prompt = "Depend on a local cinnabar checkout? Default is git dependencies."
default = false

# cargo-generate 0.20 evaluates `[conditional]` (Rhai), not a
# per-placeholder `.conditional` table. Ask for the checkout path only
# when the project should use a path dependency. The path must be absolute:
# Cargo resolves it from the generated project.
[conditional.'use_local_cinnabar'.placeholders.cinnabar_path]
type = "string"
prompt = "Absolute path to the local cinnabar checkout (the directory that contains calculate/ and verify/)"
