[package]
name = "ckb-cinnabar-calculator"
version = "0.1.0"
edition = "2021"

[features]
# NFT/Spore operations are WIP on the ckb-types-1 upgrade; gated off by default.
spore = []

[dependencies]
async-trait = "0.1.81"
bech32 = "0.8.1"
ckb-always-success-script = "0.0.1"
ckb-types = "1.1.0"
ckb-jsonrpc-types = "1.1.0"
eyre = "0.6.12"
futures = "0.3.30"
hex = "0.4.3"
serde_json = "1.0"
rand = "0.8.5"
molecule = "0.9.0"
lazy_static = "1.5.0"

ckb-hash = { version = "1.1.0", features = ["ckb-contract"] }
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1.0", features = ["derive"] }
secp256k1 = { version = "0.30", features = ["recovery"] }
tokio = { version = "1.43.0", default-features = false, features = ["rt", "macros", "time"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ckb-chain-spec = "1.1.0"
ckb-traits = "1.1.0"
ckb-script = "1.1.0"
ckb-sdk = "5.1.0"
rpassword = "7.3.1"
reqwest = { version = "0.12.5", features = ["json", "native-tls"] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { version = "0.12.5", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
