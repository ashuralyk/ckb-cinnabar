[package]
name = "ckb-cinnabar-calculator"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
# Shell (`calculate/src/shell`): std host on top of the always-on no_std kernel.
std = [
    "dep:async-trait",
    "dep:ckb-always-success-script",
    "dep:ckb-types",
    "dep:ckb-jsonrpc-types",
    "dep:eyre",
    "dep:futures",
    "dep:hex",
    "dep:serde_json",
    "dep:rand",
    "dep:lazy_static",
    "dep:getrandom",
    "dep:serde",
    "serde/std",
    "dep:secp256k1",
    "dep:tokio",
    "dep:reqwest",
    "dep:ckb-chain-spec",
    "dep:ckb-traits",
    "dep:ckb-script",
    "dep:ckb-sdk",
    "dep:rpassword",
]
# NFT/Spore operations are experimental after the ckb-types-1 upgrade; gated off by default.
# Molecule schema uses serde_molecule (alloc, no_std-capable).
spore = ["dep:serde_molecule", "dep:serde", "serde/alloc"]

[dependencies]
ckb-cinnabar-core = { version = "0.1.0", path = "../core" }
ckb-hash = { version = "1.1.0", default-features = false, features = ["ckb-contract"] }
ckb-gen-types = { version = "1.1.0", default-features = false, features = ["calc-hash"] }
bech32 = { version = "0.8.1", default-features = false }

async-trait = { version = "0.1.81", optional = true }
ckb-always-success-script = { version = "0.0.1", optional = true }
ckb-types = { version = "1.1.0", optional = true }
ckb-jsonrpc-types = { version = "1.1.0", optional = true }
eyre = { version = "0.6.12", optional = true }
futures = { version = "0.3.30", optional = true }
hex = { version = "0.4.3", optional = true }
serde_json = { version = "1.0", optional = true }
rand = { version = "0.8.5", optional = true }
lazy_static = { version = "1.5.0", optional = true }
serde_molecule = { version = "1.1", optional = true, default-features = false, features = ["alloc"] }
getrandom = { version = "0.2", optional = true, features = ["js"] }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive"] }
secp256k1 = { version = "0.30", optional = true, features = ["recovery"] }
tokio = { version = "1.43.0", optional = true, default-features = false, features = ["rt", "rt-multi-thread", "macros", "time"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ckb-chain-spec = { version = "1.1.0", optional = true }
ckb-traits = { version = "1.1.0", optional = true }
ckb-script = { version = "1.1.0", optional = true }
ckb-sdk = { version = "5.1.0", optional = true }
rpassword = { version = "7.3.1", optional = true }
reqwest = { version = "0.12.5", optional = true, features = ["json", "native-tls"] }

[target.'cfg(target_family = "wasm")'.dependencies]
reqwest = { version = "0.12.5", optional = true, default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[[test]]
name = "agent_sim"
required-features = ["std"]
