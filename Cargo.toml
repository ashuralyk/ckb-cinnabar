[workspace]
resolver = "2"

members = [
    "calculate",
    "core",
    "mcp",
    "ssri",
    "ssri/smoke",
    "verify",
    "verify/macros",
]

# Standalone example workspace (its own Cargo.toml). Not a root member.
exclude = ["examples/scenarios"]

[package]
name = "ckb-cinnabar"
version = "0.1.0"
edition = "2021"
description = "Rust framework for CKB smart contracts: off-chain Calculate, on-chain Verify, and a headless deploy CLI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ashuralyk/ckb-cinnabar"
homepage = "https://github.com/ashuralyk/ckb-cinnabar"
documentation = "https://docs.rs/ckb-cinnabar"
readme = "README.md"
keywords = ["ckb", "nervos", "smart-contract", "riscv", "blockchain"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

# docs.rs builds the host target with `--features spore`. On-chain scripts
# use `ckb-cinnabar-verifier` on `riscv64imac-unknown-none-elf`; see that
# crate's docs. The Calculate kernel also checks on that target with
# `--no-default-features`.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# Spore operations are experimental; the example cannot compile without them.
spore = ["ckb-cinnabar-calculator/spore"]

[dependencies]
chrono = "0.4.38"
hex = "0.4.3"
serde_json = "1.0"
reqwest = "0.12.5"

ckb-cinnabar-calculator = { version = "0.1.0", path = "calculate" }
clap = { version = "4.5.13", features = ["derive"] }
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }

[[example]]
name = "spore"
required-features = ["spore"]
