[package]
name = "ckb-cinnabar-verifier-ssri"
version = "0.1.0"
edition = "2021"
description = "SSRI guest door for ckb-cinnabar-verifier (unpublished until ckb-ssri-std supports ckb-std 1.1 on crates.io)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ashuralyk/ckb-cinnabar"
homepage = "https://github.com/ashuralyk/ckb-cinnabar"
documentation = "https://docs.rs/ckb-cinnabar-verifier-ssri"
readme = "../README.md"
keywords = ["ckb", "nervos", "smart-contract", "riscv", "blockchain"]
categories = ["cryptography::cryptocurrencies", "no-std"]
# crates.io `ckb-ssri-std` 0.0.1 pins ckb-std 0.16. This crate tracks the
# ckb-std 1.1 fork and cannot be published until that fork is on crates.io.
publish = false

[dependencies]
ckb-std = "1.1.0"
ckb-cinnabar-verifier = { version = "0.1.0", path = "../verify" }
ckb-cinnabar-calculator = { version = "0.1.0", path = "../calculate", default-features = false }
ckb-cinnabar-verifier-macros = { version = "0.1.0", path = "../verify/macros" }
ckb-ssri-std = { git = "https://github.com/ashuralyk/ckb-ssri-std", rev = "8c2c245" }
