[package]
name = "ckb-cinnabar-verifier"
version = "0.1.0"
edition = "2021"
description = "On-chain verification tree for CKB scripts (no_std, riscv64imac-unknown-none-elf)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ashuralyk/ckb-cinnabar"
homepage = "https://github.com/ashuralyk/ckb-cinnabar"
documentation = "https://docs.rs/ckb-cinnabar-verifier"
readme = "../README.md"
keywords = ["ckb", "nervos", "smart-contract", "riscv", "blockchain"]
categories = ["cryptography::cryptocurrencies", "no-std"]

# On-chain target is `riscv64imac-unknown-none-elf` (contract Makefile adds
# `-C passes=lower-atomic`). docs.rs builds the host target so the same
# `no_std` API renders without that linker flag. The SSRI door is the
# separate unpublished crate `ckb-cinnabar-verifier-ssri` because
# `ckb-ssri-std` crates.io 0.0.1 still pins ckb-std 0.16.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
ckb-std = "1.1.0"
blake2b-ref = "0.3.1"
ckb-cinnabar-core = { version = "0.1.0", path = "../core" }
