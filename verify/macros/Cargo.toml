[package]
name = "ckb-cinnabar-verifier-macros"
version = "0.1.0"
edition = "2021"
description = "Proc macros that re-quote SSRI method names for ckb-cinnabar-verifier"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ashuralyk/ckb-cinnabar"
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }
